name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["src/**", "migrations/**", "packaging/**", "pyproject.toml", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,desktop]"
      - name: Desktop tests (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/desktop -q
      - name: Build
        run: python -m PyInstaller packaging/gsoi.spec --noconfirm --clean
      - name: Self-test the built app (backend)
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "gsoi-home-1"
          $env:GSOI_DESKTOP_HOME = $home_dir
          $p = Start-Process -FilePath "dist\GSOI\GSOI.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content (Join-Path $home_dir "selftest.txt")
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the built app (interface)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "gsoi-home-2"
          $env:GSOI_DESKTOP_HOME = $home_dir
          $p = Start-Process -FilePath "dist\GSOI\GSOI.exe" -ArgumentList "--gui-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\GSOI -DestinationPath GSOI-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSOI-windows
          path: GSOI-windows.zip
