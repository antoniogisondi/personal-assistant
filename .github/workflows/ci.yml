name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: System libraries for Qt (offscreen UI tests)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,desktop]"
      - name: Wake-word models (a few MB, for the voice tests)
        run: .venv/bin/python -c "from gsoi_desktop.voice.wake import ensure_wake_models; ensure_wake_models()"
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Type check
        run: .venv/bin/mypy
      - name: Architecture (import-linter)
        run: .venv/bin/lint-imports
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/pytest
      - name: Security static analysis
        run: .venv/bin/bandit -q -r src
      - name: Dependency audit
        run: .venv/bin/pip-audit --skip-editable
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gsoi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gsoi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsoi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GSOI_DATABASE_URL: postgresql+asyncpg://gsoi:ci-only-password@localhost:5432/gsoi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Upgrade, downgrade, upgrade on real PostgreSQL
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: Audit-log immutability and concurrency on real PostgreSQL
        env:
          GSOI_TEST_POSTGRES_URL: postgresql+asyncpg://gsoi:ci-only-password@localhost:5432/gsoi
        run: .venv/bin/pytest tests/integration/test_postgres_audit.py -q
