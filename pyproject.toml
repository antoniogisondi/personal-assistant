[project]
name = "gsoi-assistant"
version = "0.1.0"
description = "GSOI Personal Assistant: agentic, modular, privacy-first personal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "structlog>=24.1",
  "tenacity>=9.0",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
  "cryptography>=43.0",
  "tzdata>=2024.1",  # IANA time zones on Windows
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
]

desktop = [
  # PySide6 6.12.0 crashes while painting on Python 3.11 (fine on 3.12-3.14): keep 3.11 on 6.8.
  "PySide6>=6.7,<6.9; python_version < '3.12'",
  "PySide6>=6.7; python_version >= '3.12'",
  "keyring>=25.0",
  "platformdirs>=4.0",
  "tzlocal>=5.0",
  "pyinstaller>=6.0",
  # voice: local wake word + speech recognition + microphone
  "faster-whisper>=1.0",
  "openwakeword>=0.6",
  "piper-tts>=1.3",
  "onnxruntime>=1.17",
  "sounddevice>=0.4",
  "numpy>=1.26",
]

[project.scripts]
gsoi-api = "gsoi_assistant.api.main:run"

[project.gui-scripts]
gsoi-desktop = "gsoi_desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsoi_assistant", "src/gsoi_desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"src/gsoi_assistant/api/setup_page.py" = ["E501"]  # embedded HTML/CSS/JS

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["gsoi_assistant", "gsoi_desktop"]

[[tool.mypy.overrides]]
module = ["openwakeword", "openwakeword.*", "piper", "piper.*", "sounddevice", "faster_whisper", "faster_whisper.*", "ctranslate2", "tzlocal"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_packages = ["gsoi_assistant", "gsoi_desktop"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering: api -> agent -> connectors -> tools -> llm -> security -> db -> config -> core"
type = "layers"
layers = [
  "gsoi_assistant.api",
  "gsoi_assistant.agent",
  "gsoi_assistant.connectors",
  "gsoi_assistant.tools",
  "gsoi_assistant.llm",
  "gsoi_assistant.security | gsoi_assistant.observability",
  "gsoi_assistant.db",
  "gsoi_assistant.config",
  "gsoi_assistant.core",
]

[[tool.importlinter.contracts]]
name = "LLM providers must not depend on FastAPI or the DB"
type = "forbidden"
source_modules = ["gsoi_assistant.llm.providers"]
forbidden_modules = ["fastapi", "sqlalchemy", "gsoi_assistant.api", "gsoi_assistant.db"]

[[tool.importlinter.contracts]]
name = "The backend never depends on the desktop app"
type = "forbidden"
source_modules = ["gsoi_assistant"]
forbidden_modules = ["gsoi_desktop", "PySide6"]

[[tool.importlinter.contracts]]
name = "Desktop logic (non-UI) does not depend on Qt"
type = "forbidden"
source_modules = [
  "gsoi_desktop.controller",
  "gsoi_desktop.client",
  "gsoi_desktop.config",
  "gsoi_desktop.runtime",
  "gsoi_desktop.secrets_store",
  "gsoi_desktop.autostart",
]
forbidden_modules = ["PySide6"]
