# Local development stack. Secrets come from your shell / .env (never committed).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gsoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gsoi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsoi -d gsoi"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      GSOI_DATABASE_URL: postgresql+asyncpg://gsoi:${POSTGRES_PASSWORD}@db:5432/gsoi
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      GSOI_DATABASE_URL: postgresql+asyncpg://gsoi:${POSTGRES_PASSWORD}@db:5432/gsoi
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional local model server: `docker compose --profile local up`
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
